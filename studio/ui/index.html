<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>MEC Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23007aff'/%3E%3Cpath d='M8 22V10l8 7 8-7v12' fill='none' stroke='white' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="studio.css">
</head>
<body>
<div id="app">
  <aside class="side">
    <a class="brand" href="#/overview">
      <span class="brand-mark"><svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M8 22V10l8 7 8-7v12" fill="none" stroke="#fff" stroke-width="2.600" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span><strong>MEC Studio</strong><small>mecgroup.live</small></span>
    </a>
    <nav id="side-nav" aria-label="Studio sections"></nav>
    <div class="side-foot">
      <a href="/index.html" target="_blank" rel="noopener">View saved site</a>
      <button id="theme" class="icon-btn" aria-label="Switch light or dark appearance"></button>
    </div>
  </aside>

  <div class="work">
    <header class="top">
      <h2 id="crumb">Overview</h2>
      <span class="grow"></span>
      <span id="status" class="pill ok"><span>Loading…</span></span>
      <button id="pv-toggle" class="btn ghost" hidden>Preview</button>
      <button id="discard" class="btn ghost" hidden>Discard</button>
      <button id="save" class="btn" disabled title="Save (⌘S)">Save</button>
      <button id="publish" class="btn primary" disabled>Publish</button>
    </header>

    <div class="split">
      <main id="editor" class="editor"></main>

      <section class="preview" aria-label="Live preview">
        <div class="pv-bar">
          <div class="pv-devices seg" role="group" aria-label="Preview size">
            <button data-device="desktop" title="Desktop" aria-label="Desktop"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2.500"/><path d="M9 20h6M12 16v4"/></svg></button>
            <button data-device="tablet" title="Tablet" aria-label="Tablet"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="3"/><path d="M11 17.500h2"/></svg></button>
            <button data-device="mobile" title="Phone" aria-label="Phone"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="3"/><path d="M11 17.500h2"/></svg></button>
          </div>
          <span class="pv-url"><i></i><span class="pv-path">/</span></span>
          <span class="pv-zoom muted small">100%</span>
          <button id="pv-open" class="icon-btn" title="Open preview in a new tab" aria-label="Open preview in a new tab"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.700" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 13.500v4A2.500 2.500 0 0115.500 20h-9A2.500 2.500 0 014 17.500v-9A2.500 2.500 0 016.500 6h4"/></svg></button>
        </div>
        <div class="pv-stage">
          <div class="pv-box">
            <iframe class="pv-frame front" title="Site preview"></iframe>
            <iframe class="pv-frame" title="Site preview (loading)" aria-hidden="true" tabindex="-1"></iframe>
          </div>
        </div>
      </section>
    </div>
  </div>
</div>
<div id="modals"></div>
<div id="toasts" aria-live="polite"></div>
<script src="schema.js"></script>
<script src="app.js"></script>
</body>
</html>
